<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analysis · HabitFlow</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">H</div>
      <span>HabitFlow</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Tracker</a>
      <a href="analysis.html" class="nav-link active">Analysis</a>
    </div>
  </nav>

  <div class="app">

    <div class="header">
      <h1>Weekly Analysis</h1>
      <p id="analysisDate"></p>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total habits</div>
        <div class="stat-value" id="aTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Best habit</div>
        <div class="stat-value" id="aBest">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Overall rate</div>
        <div class="stat-value" id="aRate">0%</div>
      </div>
    </div>

    <div class="analysis-grid">

      <div class="chart-card">
        <div class="chart-title">Completion per habit</div>
        <div class="chart-wrap" style="height:280px;">
          <canvas id="barChart" role="img" aria-label="Bar chart showing completion per habit this week"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Day-by-day activity</div>
        <div class="chart-wrap" style="height:280px;">
          <canvas id="lineChart" role="img" aria-label="Line chart showing daily habit completion across the week"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Habit share</div>
        <div class="chart-wrap" style="height:260px;">
          <canvas id="donutChart" role="img" aria-label="Donut chart showing share of completions per habit"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Habit report</div>
        <div id="reportTable"></div>
      </div>

    </div>

    <div class="motivation-box" id="motivationBox"></div>

    <footer class="footer">
      Made with love · HabitFlow &copy; 2025
    </footer>

  </div>

  <script src="analysis.js"></script>
</body>
</html>
